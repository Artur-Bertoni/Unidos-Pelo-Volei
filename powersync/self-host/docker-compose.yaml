services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    command: --replSet rs0 --bind_ip_all --quiet
    ports:
      - 27017:27017
    volumes:
      - mongo_data:/data/db

  mongo-rs-init:
    image: mongo:8
    depends_on:
      - mongo
    restart: on-failure
    entrypoint:
      - bash
      - -c
      - 'mongosh --host mongo:27017 --eval ''try { rs.status() } catch (e) { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongo:27017" }] }) }'''

  powersync:
    image: journeyapps/powersync-service:latest
    restart: unless-stopped
    depends_on:
      - mongo-rs-init
    command: ["start", "-r", "unified"]
    ports:
      - ${PS_PORT}:${PS_PORT}
    volumes:
      - ./config/service.yaml:/config/service.yaml:ro
      - ../sync-rules.yaml:/config/sync-config.yaml:ro
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      NODE_OPTIONS: --max-old-space-size=1000
      PS_PORT: ${PS_PORT}
      PS_MONGO_URI: mongodb://mongo:27017/powersync_unidos_volei
      PS_DATA_SOURCE_URI: ${PS_DATA_SOURCE_URI}
      PS_SUPABASE_JWT_SECRET: ${PS_SUPABASE_JWT_SECRET}

volumes:
  mongo_data:
