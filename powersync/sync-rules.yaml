config:
  edition: 3

streams:
  campeonato:
    auto_subscribe: true
    queries:
      - SELECT * FROM players
      - SELECT * FROM teams
      - SELECT * FROM team_players
      - SELECT * FROM rounds
      - SELECT * FROM matches
      - SELECT * FROM game_days
      - SELECT * FROM player_day_stats

  meu_perfil:
    auto_subscribe: true
    query: SELECT * FROM profiles WHERE id = auth.user_id()
