config:
  edition: 3

streams:
  meu_perfil:
    auto_subscribe: true
    query: SELECT * FROM profiles WHERE id = auth.user_id()

  meus_grupos:
    auto_subscribe: true
    queries:
      - SELECT * FROM grupos WHERE id IN (SELECT grupo_id FROM grupo_membros WHERE profile_id = auth.user_id())
      - SELECT * FROM grupo_membros WHERE grupo_id IN (SELECT grupo_id FROM grupo_membros WHERE profile_id = auth.user_id())

  campeonato:
    auto_subscribe: true
    queries:
      - SELECT * FROM players WHERE grupo_id IN (SELECT grupo_id FROM grupo_membros WHERE profile_id = auth.user_id())
      - SELECT * FROM teams WHERE grupo_id IN (SELECT grupo_id FROM grupo_membros WHERE profile_id = auth.user_id())
      - SELECT * FROM team_players WHERE grupo_id IN (SELECT grupo_id FROM grupo_membros WHERE profile_id = auth.user_id())
      - SELECT * FROM rounds WHERE grupo_id IN (SELECT grupo_id FROM grupo_membros WHERE profile_id = auth.user_id())
      - SELECT * FROM matches WHERE grupo_id IN (SELECT grupo_id FROM grupo_membros WHERE profile_id = auth.user_id())
      - SELECT * FROM game_days WHERE grupo_id IN (SELECT grupo_id FROM grupo_membros WHERE profile_id = auth.user_id())
      - SELECT * FROM player_day_stats WHERE grupo_id IN (SELECT grupo_id FROM grupo_membros WHERE profile_id = auth.user_id())
      - SELECT * FROM vinculo_pedidos WHERE grupo_id IN (SELECT grupo_id FROM grupo_membros WHERE profile_id = auth.user_id())
      - SELECT * FROM config_grupo WHERE grupo_id IN (SELECT grupo_id FROM grupo_membros WHERE profile_id = auth.user_id())
      - SELECT * FROM presencas WHERE grupo_id IN (SELECT grupo_id FROM grupo_membros WHERE profile_id = auth.user_id())
      - SELECT * FROM avisos WHERE grupo_id IN (SELECT grupo_id FROM grupo_membros WHERE profile_id = auth.user_id())

  grupo:
    auto_subscribe: true
    queries:
      - SELECT * FROM posts WHERE grupo_id IN (SELECT grupo_id FROM grupo_membros WHERE profile_id = auth.user_id())
      - SELECT * FROM post_reacoes WHERE grupo_id IN (SELECT grupo_id FROM grupo_membros WHERE profile_id = auth.user_id())
      - SELECT * FROM eventos WHERE grupo_id IN (SELECT grupo_id FROM grupo_membros WHERE profile_id = auth.user_id())
      - SELECT * FROM paginas WHERE grupo_id IN (SELECT grupo_id FROM grupo_membros WHERE profile_id = auth.user_id())
      - SELECT * FROM config_financeiro WHERE grupo_id IN (SELECT grupo_id FROM grupo_membros WHERE profile_id = auth.user_id())
      - SELECT * FROM cobrancas WHERE grupo_id IN (SELECT grupo_id FROM grupo_membros WHERE profile_id = auth.user_id())

  dicas:
    auto_subscribe: true
    query: SELECT * FROM dicas

  meus_contatos:
    auto_subscribe: true
    query: SELECT * FROM player_contatos WHERE profile_id = auth.user_id()

  meus_dispositivos:
    auto_subscribe: true
    query: SELECT * FROM dispositivos WHERE profile_id = auth.user_id()

  meu_financeiro:
    auto_subscribe: true
    query: SELECT * FROM pagamentos WHERE profile_id = auth.user_id()

  minha_evolucao:
    auto_subscribe: true
    queries:
      - SELECT * FROM player_evolucao WHERE profile_id = auth.user_id()
      - SELECT * FROM player_nota_historico WHERE profile_id = auth.user_id()
      - SELECT * FROM avaliacao_registros WHERE profile_id = auth.user_id()
